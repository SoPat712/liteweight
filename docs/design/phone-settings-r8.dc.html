<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings restyled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 440px; min-height: 1120px; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 96px 16px 40px; box-sizing: border-box">
  <h1 style="margin: 0 4px 14px; font-size: 34px; font-weight: 700; letter-spacing: -0.4px">Settings</h1>

  <sc-if value="{{header}}" hint-placeholder-val="{{ true }}">
  <button style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 0; border-radius: 22px; background: {{t.card}}; color: {{t.label}}; font: inherit; text-align: left; cursor: pointer; box-sizing: border-box">
    <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(160deg, #3D9BFF, #0A6CFF); display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 20px; font-weight: 700">liteweight</div>
      <div style="font-size: 14px; font-weight: 600; margin-top: 2px"><span style="color: {{t.blue}}">453 workouts</span><span style="color: {{t.label2}}"> · since Mar 2023</span></div>
      <div style="font-size: 13px; color: {{t.label2}}; margin-top: 1px">Version 1.6 (43)</div>
    </div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.chev}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </button>
  </sc-if>

  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
    <div style="margin: 22px 16px 7px; font-size: 13px; font-weight: 600; color: {{t.label2}}">{{sec.title}}</div>
    <div style="border-radius: 22px; background: {{t.card}}; overflow: hidden">
      <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
        <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 16px; border: 0; background: transparent; color: {{t.label}}; font: inherit; text-align: left; cursor: pointer; box-sizing: border-box">
          <div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: {{r.tile}}; box-shadow: {{r.edge}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="{{r.fill}}" stroke="{{r.stroke}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
          </div>
          <div style="flex: 1; display: flex; align-items: center; min-height: 52px; box-shadow: {{r.sep}}">
            <div style="flex: 1; font-size: 17px">{{r.name}}</div>
            <div style="font-size: 17px; color: {{r.valueColor}}; margin-right: 8px">{{r.value}}</div>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{t.chev}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </div>
        </button>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"header":{"editor":"boolean","default":true},"$preview":{"width":440,"height":1120}}'>
var I = {
  appearance: 'M12 3a9 9 0 1 0 0 18zM12 3a9 9 0 0 1 0 18',
  units: 'M5.5 9h13l-1.6 11H7.1zM9 9a3 3 0 0 1 6 0',
  prefs: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',
  sounds: 'M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11',
  health: 'M12 20.6c-.3 0-.6-.1-.8-.3C7.4 17.1 2.5 13.4 2.5 8.7 2.5 5.8 4.7 3.6 7.4 3.6c1.9 0 3.5 1 4.6 2.6 1.1-1.6 2.7-2.6 4.6-2.6 2.7 0 4.9 2.2 4.9 5.1 0 4.7-4.9 8.4-8.7 11.6-.2.2-.5.3-.8.3z',
  watch: 'M8 6.5h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM9 6.5l.7-3.5h4.6l.7 3.5M9 17.5l.7 3.5h4.6l.7-3.5',
  data: 'M7.5 20V4M3.5 8l4-4 4 4M16.5 4v16M12.5 16l4 4 4-4',
  feedback: 'M21 3L10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z',
  rate: 'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z',
  licenses: 'M7 3.5h7.5L19 8v12.5H7zM14 3.5V8.5h5M10 13h6M10 16.5h4',
  about: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5v.2',
  dev: 'M14.5 6.5l3 3-9 9H5.5v-3zM13 8l3 3M16 4l4 4'
};
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var t = dark ? { bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', label2: 'rgba(235,235,245,0.6)', chev: 'rgba(235,235,245,0.3)', sep: 'rgba(84,84,88,0.65)', blue: '#409CFF', green: '#30D158' }
                 : { bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', label2: 'rgba(60,60,67,0.6)', chev: 'rgba(60,60,67,0.3)', sep: 'rgba(60,60,67,0.18)', blue: '#007AFF', green: '#248A3D' };
    var row = function (name, icon, tile, value, opts) {
      opts = opts || {};
      return { name: name, icon: I[icon], tile: tile, value: value || '', valueColor: opts.valueColor || t.label2,
        fill: opts.fill || 'none', stroke: opts.stroke || '#FFFFFF', edge: opts.edge || 'none', sep: 'none' };
    };
    var sections = [
      { title: '', rows: [row('Appearance', 'appearance', '#5856D6', 'System')] },
      { title: 'Training', rows: [
        row('Units', 'units', '#FF9500', 'Imperial (lb)'),
        row('Workout preferences', 'prefs', '#007AFF', ''),
        row('Sounds & haptics', 'sounds', '#FF2D55', ''),
        row('Apple Health', 'health', '#FFFFFF', '', { fill: '#FF2D55', stroke: 'none', edge: 'inset 0 0 0 1px rgba(0,0,0,0.08)' }),
        row('Apple Watch', 'watch', '#2C2C2E', '', { edge: dark ? 'inset 0 0 0 1px rgba(255,255,255,0.18)' : 'none' })
      ] },
      { title: 'Your Data', rows: [row('Import & export', 'data', '#34C759', '')] },
      { title: 'Support', rows: [
        row('Send feedback', 'feedback', '#007AFF'),
        row('Rate liteweight', 'rate', '#FFCC00', '', { fill: '#FFFFFF', stroke: 'none' }),
        row('Licenses & attributions', 'licenses', '#8E8E93'),
        row('About liteweight', 'about', '#8E8E93')
      ] },
      { title: 'Development', rows: [row('Developer settings', 'dev', '#636366', '')] }
    ];
    sections.forEach(function (s) { s.rows.forEach(function (r, i) { r.sep = i < s.rows.length - 1 ? 'inset 0 -0.5px 0 ' + t.sep : 'none'; }); });
    return { t: t, sections: sections, header: this.props.header ?? true };
  }
}
</script>
</body>
</html>
